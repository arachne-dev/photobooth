
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arachne Style Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Pretendard Variable', sans-serif;
            overflow: hidden;
            color: #1D1E2C;
        }
        .font-pixel {
            font-family: 'VT323', monospace;
        }
        .font-dot {
            font-family: 'DotGothic16', sans-serif;
        }
        .font-pretendard {
            font-family: 'Pretendard Variable', sans-serif;
        }

        @keyframes print-down {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .printing-animation {
            animation: print-down 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Loading diamonds animation */
        @keyframes diamond-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .diamond {
            width: 12px;
            height: 12px;
            background: #A56CE8;
            transform: rotate(45deg);
        }

        .diamond-animate {
            animation: diamond-pulse 1.5s ease-in-out infinite;
        }

        /* Camera frame corners */
        .camera-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #1D1E2C;
        }
        .camera-corner-tl { top: -6px; left: -6px; }
        .camera-corner-tr { top: -6px; right: -6px; }
        .camera-corner-bl { bottom: -6px; left: -6px; }
        .camera-corner-br { bottom: -6px; right: -6px; }

        /* Camera flash animation */
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .animate-flash {
            animation: flash 0.15s ease-out forwards;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #A56CE8;
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="overflow-hidden bg-white">
    <div id="root" class="h-screen"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
